---
- name: Deploy EGiB parser microservice
  hosts: mikrus
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Validate required egib-parser deployment variables
      ansible.builtin.assert:
        that:
          - egib_parser_api_key is defined
          - egib_parser_api_key | length > 0
        fail_msg: Required egib-parser variables are missing.

  tasks:
    - name: Ensure egib-parser source directory exists
      ansible.builtin.file:
        path: "{{ egib_parser_src_dir }}"
        state: directory
        mode: "0755"

    - name: Copy egib-parser service source
      ansible.builtin.copy:
        src: ../../services/egib-parser/
        dest: "{{ egib_parser_src_dir }}/"
        mode: "0644"

    - name: Build the egib-parser image
      community.docker.docker_image:
        name: "{{ egib_parser_image }}"
        build:
          path: "{{ egib_parser_src_dir }}"
        source: build
        force_source: true

    - name: Ensure the internal egib-parser network exists
      community.docker.docker_network:
        name: "{{ egib_parser_network }}"
        state: present

    - name: Run egib-parser container
      community.docker.docker_container:
        name: "{{ egib_parser_name }}"
        image: "{{ egib_parser_image }}"
        state: started
        restart_policy: always
        recreate: true
        networks:
          - name: "{{ egib_parser_network }}"
        env:
          EGIB_PARSER_API_KEY: "{{ egib_parser_api_key }}"
      no_log: true

    - name: Wait for egib-parser health endpoint
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ egib_parser_name }}"
          - python
          - -c
          - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      register: egib_parser_health
      retries: 20
      delay: 3
      until: egib_parser_health.rc == 0
      changed_when: false
