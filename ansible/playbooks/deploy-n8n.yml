---
- name: Deploy n8n
  hosts: mikrus
  gather_facts: false
  vars:
    deploy_dir: /opt/apps
    network_name: mikrus
    n8n_data_dir: /root/.n8n

  tasks:
    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure n8n data directory exists
      ansible.builtin.file:
        path: "{{ n8n_data_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Copy Compose definition
      ansible.builtin.copy:
        src: ../../compose.yaml
        dest: "{{ deploy_dir }}/compose.yaml"
        mode: "0644"

    - name: Ensure the shared Docker network exists
      community.docker.docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Pull the configured n8n image
      ansible.builtin.command:
        cmd: docker compose pull n8n
        chdir: "{{ deploy_dir }}"
      environment:
        N8N_ENCRYPTION_KEY: "{{ n8n_encryption_key }}"
        KIDDO_IMAGE: unused
      changed_when: true

    - name: Start n8n
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps n8n
        chdir: "{{ deploy_dir }}"
      environment:
        N8N_ENCRYPTION_KEY: "{{ n8n_encryption_key }}"
        KIDDO_IMAGE: unused
      changed_when: true

    - name: Wait for n8n to answer through Traefik
      ansible.builtin.command:
        cmd: >-
          curl --fail --silent --show-error --insecure
          --resolve n8n.mleczki.pl:443:127.0.0.1
          https://n8n.mleczki.pl/healthz
      register: n8n_health
      retries: 20
      delay: 3
      until: n8n_health.rc == 0
      changed_when: false

    - name: Show n8n container status
      ansible.builtin.command:
        cmd: docker compose ps n8n
        chdir: "{{ deploy_dir }}"
      environment:
        N8N_ENCRYPTION_KEY: "{{ n8n_encryption_key }}"
        KIDDO_IMAGE: unused
      changed_when: false
