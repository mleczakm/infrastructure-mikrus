---
- name: Deploy EGiB parser microservice
  hosts: mikrus
  gather_facts: false
  vars:
    deploy_dir: /opt/apps
    network_name: mikrus

  tasks:
    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Compose definition
      ansible.builtin.copy:
        src: ../../compose.yaml
        dest: "{{ deploy_dir }}/compose.yaml"
        mode: "0644"

    - name: Copy egib-parser service source
      ansible.builtin.copy:
        src: ../../services/egib-parser/
        dest: "{{ deploy_dir }}/services/egib-parser/"
        mode: "0644"

    - name: Ensure the shared Docker network exists
      community.docker.docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Build the egib-parser image
      ansible.builtin.command:
        cmd: docker compose build egib-parser
        chdir: "{{ deploy_dir }}"
      environment:
        N8N_ENCRYPTION_KEY: unused
        KIDDO_IMAGE: unused
      changed_when: true

    - name: Start egib-parser
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps egib-parser
        chdir: "{{ deploy_dir }}"
      environment:
        N8N_ENCRYPTION_KEY: unused
        KIDDO_IMAGE: unused
      changed_when: true

    - name: Wait for egib-parser health check
      ansible.builtin.command:
        cmd: docker compose exec -T egib-parser python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        chdir: "{{ deploy_dir }}"
      register: egib_health
      retries: 20
      delay: 3
      until: egib_health.rc == 0
      changed_when: false

    - name: Show egib-parser container status
      ansible.builtin.command:
        cmd: docker compose ps egib-parser
        chdir: "{{ deploy_dir }}"
      changed_when: false
