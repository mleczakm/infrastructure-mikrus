ansible_python_interpreter: /usr/bin/python3
deploy_dir: /opt/apps
docker_users: ["root"]

# Alpine OS specific
alpine_packages:
  - docker
  - python3
  - py3-requests
  - py3-docker
  - openssh-client

# Network configuration
network_name: mikrus
external_network: true

# Domain configuration
domains_dir: /opt/apps/domains

# Beszel monitoring
beszel_agent_image: "henrygd/beszel-agent"
beszel_agent_name: "beszel-agent"
beszel_agent_volume: "beszel_agent_data"
beszel_agent_listen: "45876"

# n8n
n8n_name: n8n
n8n_domain: n8n.mleczki.pl
n8n_image: docker.n8n.io/n8nio/n8n:stable
n8n_port: 8082
n8n_data_dir: /var/lib/n8n
n8n_backup_dir: /var/lib/n8n-backups
