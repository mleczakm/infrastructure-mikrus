---
- name: Weekly Mikrus Server Maintenance
  hosts: mikrus
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  vars:
    maintenance_log: "/var/log/mikrus-maintenance.log"
    max_log_size: "10M"
    log_retention_days: 30
    target_alpine_version: "3.23"
    auto_upgrade_alpine: true

  pre_tasks:
    - name: Validate n8n maintenance variables
      ansible.builtin.assert:
        that:
          - mikrus_ipv6 is defined
          - mikrus_ipv6 | length > 0
          - n8n_encryption_key is defined
          - n8n_encryption_key | length > 0
        fail_msg: MIKRUS_IPV6 and N8N_ENCRYPTION_KEY are required for n8n maintenance.
      tags: [n8n]

  tasks:
    - name: Create maintenance log entry
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Starting weekly maintenance"
        create: yes
        state: present
      tags: [maintenance]

    # -------------------------
    # Alpine Version Check
    # -------------------------
    - name: Get current Alpine version
      ansible.builtin.shell: cat /etc/alpine-release
      register: current_alpine_version
      changed_when: false
      tags: [system, version, check]

    - name: Parse current Alpine version
      ansible.builtin.set_fact:
        current_version: "{{ current_alpine_version.stdout | regex_replace('^([0-9]+)\\.([0-9]+)\\.([0-9]+).*$', '\\1.\\2') }}"
      tags: [system, version, check]

    - name: Get latest stable Alpine version
      ansible.builtin.uri:
        url: "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml"
        method: GET
      register: alpine_releases
      failed_when: false
      tags: [system, version, check]

    - name: Parse latest stable version from API
      ansible.builtin.set_fact:
        latest_stable_version: "{{ alpine_releases.content | regex_search('version: ([0-9]+\\.[0-9]+)\\.[0-9]+', '\\1') | default(target_alpine_version) }}"
      when: alpine_releases.status == 200
      tags: [system, version, check]

    - name: Fallback to target version if API fails
      ansible.builtin.set_fact:
        latest_stable_version: "{{ target_alpine_version }}"
      when: alpine_releases.status != 200
      tags: [system, version, check]

    - name: Check if Alpine version upgrade is needed
      ansible.builtin.set_fact:
        alpine_upgrade_needed: "{{ current_version != latest_stable_version }}"
      tags: [system, version, check]

    - name: Log Alpine version status
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Alpine version check: {{ current_version }} (latest stable: {{ latest_stable_version }}) {{ alpine_upgrade_needed | ternary('UPGRADE NEEDED', 'UP TO DATE') }}"
      tags: [maintenance, system, version]

    - name: Display Alpine version information
      ansible.builtin.debug:
        msg: |
          Alpine Version Status:
          - Current: {{ current_version }}
          - Latest stable: {{ latest_stable_version }}
          - Upgrade needed: {{ alpine_upgrade_needed }}
          - Auto-upgrade enabled: {{ auto_upgrade_alpine }}
      tags: [system, version, check]

    - name: Detect current Python interpreter path
      ansible.builtin.shell: |
        which python3 || which python3.10 || which python3.11 || which python3.12 || echo "/usr/bin/python3"
      register: python_interpreter_path
      changed_when: false
      tags: [system, version, check]

    - name: Set Python interpreter fact for current session
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ python_interpreter_path.stdout }}"
      tags: [system, version, check]

    - name: Create backup directory for Alpine upgrade
      ansible.builtin.file:
        path: "/var/backups/alpine-upgrade-{{ ansible_facts['date_time']['iso8601'] }}"
        state: directory
        mode: '0755'
      when: alpine_upgrade_needed and auto_upgrade_alpine
      tags: [system, version, upgrade]

    - name: Backup package list before Alpine upgrade
      ansible.builtin.shell: apk info | sort > /var/backups/alpine-upgrade-{{ ansible_facts['date_time']['iso8601'] }}/packages-before.txt
      when: alpine_upgrade_needed and auto_upgrade_alpine
      tags: [system, version, upgrade]

    - name: Update repositories to latest stable
      ansible.builtin.lineinfile:
        path: /etc/apk/repositories
        regexp: '^#?http.*alpine.*v[0-9]+\.[0-9]+.*'
        line: 'https://dl-cdn.alpinelinux.org/alpine/latest-stable/main'
        backup: yes
      when: alpine_upgrade_needed and auto_upgrade_alpine
      register: repo_update
      tags: [system, version, upgrade]

    - name: Add community repository for latest stable
      ansible.builtin.lineinfile:
        path: /etc/apk/repositories
        line: 'https://dl-cdn.alpinelinux.org/alpine/latest-stable/community'
        create: yes
      when: alpine_upgrade_needed and auto_upgrade_alpine and repo_update.changed
      tags: [system, version, upgrade]

    - name: Update package index with new repositories
      community.general.apk:
        update_cache: true
      when: alpine_upgrade_needed and auto_upgrade_alpine
      register: apk_update
      tags: [system, version, upgrade]

    - name: Upgrade apk package manager first
      community.general.apk:
        name:
          - apk-tools
        state: latest
        update_cache: true
      when: alpine_upgrade_needed and auto_upgrade_alpine
      register: apk_tools_upgrade
      tags: [system, version, upgrade]

    - name: Perform full Alpine system upgrade
      community.general.apk:
        upgrade: true
      when: alpine_upgrade_needed and auto_upgrade_alpine
      register: alpine_system_upgrade
      tags: [system, version, upgrade]

    - name: Log Alpine upgrade results
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Alpine OS upgrade performed: {{ alpine_system_upgrade.changed | ternary('SUCCESS', 'NO CHANGES') }}"
      when: alpine_upgrade_needed and auto_upgrade_alpine
      tags: [maintenance, system, version]

    - name: Reboot after Alpine upgrade
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Wait for SSH after Alpine upgrade reboot
      ansible.builtin.wait_for_connection:
        timeout: 600
        delay: 30
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Fix PAM configuration after Alpine upgrade
      block:
        - name: Ensure linux-pam is installed
          community.general.apk:
            name: linux-pam
            state: latest
            update_cache: true
          when: ansible_facts['os_family'] == "Alpine"

        - name: Ensure PAM configuration directory exists
          ansible.builtin.file:
            path: /etc/pam.d
            state: directory
            mode: "0755"
          when: ansible_facts['os_family'] == "Alpine"

        - name: Check PAM configuration directory
          ansible.builtin.stat:
            path: /etc/pam.d
          register: pam_d_dir
          when: ansible_facts['os_family'] == "Alpine"

        - name: Backup PAM configuration
          ansible.builtin.archive:
            path: /etc/pam.d
            dest: "/etc/pam.d.backup.{{ ansible_facts['date_time']['epoch'] }}.tar.gz"
            format: gz
          when:
            - ansible_facts['os_family'] == "Alpine"
            - pam_d_dir.stat.isdir | default(false)

        - name: Create PAM sshd configuration
          ansible.builtin.copy:
            dest: /etc/pam.d/sshd
            content: |
              #%PAM-1.0
              auth       required     pam_unix.so
              account    required     pam_unix.so
              password   required     pam_unix.so
              session    required     pam_unix.so
            mode: '0644'
          when: ansible_facts['os_family'] == "Alpine"

        - name: Create PAM base-auth configuration
          ansible.builtin.copy:
            dest: /etc/pam.d/base-auth
            content: |
              #%PAM-1.0
              auth       required     pam_unix.so nullok
              account    required     pam_unix.so
              password   required     pam_unix.so
              session    required     pam_unix.so
            mode: '0644'
          when: ansible_facts['os_family'] == "Alpine"

        - name: Create PAM base-account configuration
          ansible.builtin.copy:
            dest: /etc/pam.d/base-account
            content: |
              #%PAM-1.0
              account    required     pam_unix.so
            mode: '0644'
          when: ansible_facts['os_family'] == "Alpine"

        - name: Create PAM base-password configuration
          ansible.builtin.copy:
            dest: /etc/pam.d/base-password
            content: |
              #%PAM-1.0
              password   required     pam_unix.so
            mode: '0644'
          when: ansible_facts['os_family'] == "Alpine"

        - name: Create PAM base-session configuration
          ansible.builtin.copy:
            dest: /etc/pam.d/base-session
            content: |
              #%PAM-1.0
              session    required     pam_unix.so
            mode: '0644'
          when: ansible_facts['os_family'] == "Alpine"

        - name: Set correct permissions for PAM directory
          ansible.builtin.file:
            path: /etc/pam.d
            mode: "0755"
          when: ansible_facts['os_family'] == "Alpine"

        - name: Set correct permissions for PAM files
          ansible.builtin.file:
            path: "{{ item }}"
            mode: "0644"
          loop:
            - /etc/pam.d/sshd
            - /etc/pam.d/base-auth
            - /etc/pam.d/base-account
            - /etc/pam.d/base-password
            - /etc/pam.d/base-session
          when: ansible_facts['os_family'] == "Alpine"

        - name: Verify SSH configuration syntax
          ansible.builtin.command: sshd -t
          register: ssh_config_check
          changed_when: false
          failed_when: false

        - name: Log PAM fix completion
          ansible.builtin.lineinfile:
            path: "{{ maintenance_log }}"
            line: "{{ ansible_facts['date_time']['iso8601'] }} - PAM configuration fixed after Alpine upgrade"
          when: ansible_facts['os_family'] == "Alpine"

      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade, pam]

    - name: Re-detect Python interpreter after upgrade
      ansible.builtin.shell: |
        which python3 || which python3.10 || which python3.11 || which python3.12 || echo "/usr/bin/python3"
      register: new_python_interpreter_path
      changed_when: false
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Update Python interpreter fact after upgrade
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ new_python_interpreter_path.stdout }}"
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Verify Python availability after upgrade
      ansible.builtin.command: "{{ ansible_python_interpreter }} --version"
      register: python_version_check
      changed_when: false
      failed_when: false
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Display Python status after upgrade
      ansible.builtin.debug:
        msg: |
          Python interpreter after upgrade:
          - Path: {{ ansible_python_interpreter }}
          - Version: {{ python_version_check.stdout | default('Not available') }}
          - Status: {{ python_version_check.rc == 0 | ternary('OK', 'ERROR') }}
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Verify SSH service after PAM fix
      ansible.builtin.service:
        name: sshd
        state: started
      register: ssh_final_status
      when: alpine_upgrade_needed and auto_upgrade_alpine and (alpine_system_upgrade.changed or apk_tools_upgrade.changed)
      tags: [system, version, upgrade]

    - name: Alert about available Alpine upgrade
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - ALERT: Alpine OS upgrade available ({{ current_version }} -> {{ latest_stable_version }}). Run with -e 'auto_upgrade_alpine=true' to upgrade."
      when: alpine_upgrade_needed and not auto_upgrade_alpine
      tags: [maintenance, system, alert]

    # -------------------------
    # System Updates
    # -------------------------
    - name: Update Alpine package index
      community.general.apk:
        update_cache: true
      register: apk_update
      tags: [system, update]

    - name: Upgrade all Alpine packages
      community.general.apk:
        upgrade: true
      register: apk_upgrade
      tags: [system, update]

    - name: Log system update results
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - System update: {{ apk_upgrade.changed | ternary('Packages upgraded', 'No updates available') }}"
      tags: [maintenance, system]

    # -------------------------
    # n8n backup and update
    # -------------------------
    - name: Ensure SQLite and n8n backup directory are available
      block:
        - name: Install SQLite
          community.general.apk:
            name: sqlite
            state: present

        - name: Create n8n backup directory
          ansible.builtin.file:
            path: "{{ n8n_backup_dir }}/pre-update"
            state: directory
            owner: root
            group: root
            mode: "0700"
      tags: [n8n]

    - name: Check for n8n SQLite database
      ansible.builtin.stat:
        path: "{{ n8n_data_dir }}/database.sqlite"
      register: n8n_database
      tags: [n8n]

    - name: Create and verify transactionally consistent n8n backup
      when: n8n_database.stat.exists
      block:
        - name: Create n8n SQLite online backup
          ansible.builtin.command:
            argv:
              - sqlite3
              - "{{ n8n_data_dir }}/database.sqlite"
              - ".backup {{ n8n_backup_dir }}/pre-update/database-{{ ansible_facts['date_time']['epoch'] }}.sqlite"
          register: n8n_sqlite_backup
          changed_when: true

        - name: Verify n8n SQLite backup integrity
          ansible.builtin.command:
            argv:
              - sqlite3
              - "{{ n8n_backup_dir }}/pre-update/database-{{ ansible_facts['date_time']['epoch'] }}.sqlite"
              - PRAGMA integrity_check;
          register: n8n_backup_integrity
          changed_when: false
          failed_when: n8n_backup_integrity.stdout | trim != 'ok'
      tags: [n8n]

    - name: Read current local n8n image ID
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ n8n_image }}"]
      register: n8n_image_before
      changed_when: false
      failed_when: false
      tags: [n8n]

    - name: Pull current stable n8n image
      ansible.builtin.command:
        argv: [docker, pull, "{{ n8n_image }}"]
      register: n8n_pull
      changed_when: "'Downloaded newer image' in n8n_pull.stdout"
      tags: [n8n]

    - name: Read updated local n8n image ID
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ n8n_image }}"]
      register: n8n_image_after
      changed_when: false
      tags: [n8n]

    - name: Recreate n8n only when stable image changed
      community.docker.docker_container:
        name: "{{ n8n_name }}"
        image: "{{ n8n_image }}"
        state: started
        restart_policy: always
        recreate: true
        published_ports:
          - "[{{ mikrus_ipv6 }}]:{{ n8n_port }}:5678"
        volumes:
          - "{{ n8n_data_dir }}:/home/node/.n8n"
        env:
          N8N_HOST: "{{ n8n_domain }}"
          N8N_PROTOCOL: https
          N8N_PORT: "5678"
          N8N_PROXY_HOPS: "1"
          N8N_ENCRYPTION_KEY: "{{ n8n_encryption_key }}"
          NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
          WEBHOOK_URL: "https://{{ n8n_domain }}/"
          N8N_EDITOR_BASE_URL: "https://{{ n8n_domain }}/"
          GENERIC_TIMEZONE: Europe/Warsaw
          TZ: Europe/Warsaw
      when: n8n_image_before.stdout | default('') != n8n_image_after.stdout
      no_log: true
      tags: [n8n]

    - name: Verify n8n health after update check
      ansible.builtin.uri:
        url: "http://[{{ mikrus_ipv6 }}]:{{ n8n_port }}/healthz"
        status_code: 200
      register: n8n_health
      retries: 12
      delay: 5
      until: n8n_health.status == 200
      tags: [n8n]

    - name: Remove n8n pre-update backups older than 14 days
      ansible.builtin.find:
        paths: "{{ n8n_backup_dir }}/pre-update"
        patterns: database-*.sqlite
        age: 14d
      register: old_n8n_backups
      tags: [n8n]

    - name: Delete old n8n pre-update backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_n8n_backups.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [n8n]

    # -------------------------
    # Docker Cleanup
    # -------------------------
    - name: Ensure Python deps for Ansible Docker modules
      community.general.apk:
        name:
          - py3-requests
          - py3-docker-py
        state: latest
        update_cache: true
      tags: [docker, cleanup, maintenance, health, containers]

    - name: Prune Docker system (aggressive cleanup)
      community.docker.docker_prune:
        containers: true
        images: true
        networks: true
        volumes: true
        builder_cache: true
      register: docker_prune
      tags: [docker, cleanup]

    - name: Log Docker cleanup results
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Docker cleanup: {{ docker_prune.changed | ternary('Cleaned up unused resources', 'No cleanup needed') }}"
      tags: [maintenance, docker]

    # -------------------------
    # Log Management
    # -------------------------
    - name: Find large log files (>1MB)
      ansible.builtin.find:
        paths: /var/log
        patterns: "*.log"
        size: "1m"
        file_type: file
      register: large_logs
      tags: [logs, cleanup]

    - name: Truncate large log files
      ansible.builtin.copy:
        content: ""
        dest: "{{ item.path }}"
        force: yes
        backup: yes
      loop: "{{ large_logs.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: truncated_logs
      when: large_logs.files | length > 0
      tags: [logs, cleanup]

    - name: Log file truncation results
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Log cleanup: {{ truncated_logs.results | selectattr('changed') | list | length }} files truncated"
      tags: [maintenance, logs]

    # -------------------------
    # Container Health Check
    # -------------------------
    - name: Get all running containers
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: container_status
      loop:
        - traefik
        - caddy
        - php83
        - php74
        - sftp
        - n8n
        - kiddo
        - autoheal
        - beszel-agent
      failed_when: false
      tags: [maintenance, health, containers]

    - name: Report container status
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Container {{ item.item }}: {{ item.container.State.Status | default('not found') }}"
      loop: "{{ container_status.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [maintenance, health]

    # -------------------------
    # Disk Space Check
    # -------------------------
    - name: Check disk space
      ansible.builtin.shell: df -h / | tail -1 | awk '{print $5}' | sed 's/%//'
      register: disk_usage
      changed_when: false
      tags: [maintenance, health, disk]

    - name: Log disk usage
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Disk usage: {{ disk_usage.stdout }}%"
      tags: [maintenance, disk]

    - name: Alert on high disk usage (>80%)
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - WARNING: High disk usage detected ({{ disk_usage.stdout }}%)"
      when: disk_usage.stdout | int > 80
      tags: [maintenance, disk, alert]

    # -------------------------
    # Log Rotation
    # -------------------------
    - name: Rotate maintenance log if too large
      ansible.builtin.stat:
        path: "{{ maintenance_log }}"
      register: maintenance_log_stat
      tags: [logs, maintenance]

    - name: Backup and truncate maintenance log
      ansible.builtin.copy:
        src: "{{ maintenance_log }}"
        dest: "{{ maintenance_log }}.{{ ansible_facts['date_time']['epoch'] }}"
        remote_src: yes
      when: maintenance_log_stat.stat.exists and maintenance_log_stat.stat.size > 10485760  # 10MB
      tags: [logs, maintenance]

    - name: Truncate maintenance log
      ansible.builtin.copy:
        content: "{{ ansible_facts['date_time']['iso8601'] }} - Log rotated due to size\n"
        dest: "{{ maintenance_log }}"
      when: maintenance_log_stat.stat.exists and maintenance_log_stat.stat.size > 10485760
      tags: [logs, maintenance]

    - name: Clean old maintenance logs (older than 30 days)
      ansible.builtin.find:
        paths: "/var/log"
        patterns: "mikrus-maintenance.log.*"
        age: "{{ log_retention_days }}d"
      register: old_logs
      tags: [logs, cleanup]

    - name: Remove old maintenance logs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: old_logs.files | length > 0
      tags: [logs, cleanup]

    # -------------------------
    # Final Report
    # -------------------------
    - name: Create maintenance summary
      ansible.builtin.lineinfile:
        path: "{{ maintenance_log }}"
        line: "{{ ansible_facts['date_time']['iso8601'] }} - Weekly maintenance completed successfully"
      tags: [maintenance]

    - name: Display maintenance summary
      ansible.builtin.debug:
        msg: |
          Weekly maintenance completed:
          - System: {{ apk_upgrade.changed | ternary('Updated', 'No updates') }}
          - Docker: {{ docker_prune.changed | ternary('Cleaned', 'No cleanup') }}
          - Logs: {{ truncated_logs.results | selectattr('changed') | list | length }} files truncated
          - Disk usage: {{ disk_usage.stdout }}%
          - Container status logged
      tags: [maintenance, summary]
