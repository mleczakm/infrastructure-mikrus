name: Provision Mikrus Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  provision:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ansible + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r ansible-collections-requirements.yml

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIKRUS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.MIKRUS_PORT }}" "${{ secrets.MIKRUS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Ansible playbooks
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/base.yml \
            -e "ansible_host=${{ secrets.MIKRUS_HOST }}" -e "ansible_port=${{ secrets.MIKRUS_PORT }}"
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/n8n.yml \
            -e "ansible_host=${{ secrets.MIKRUS_HOST }}" \
            -e "ansible_port=${{ secrets.MIKRUS_PORT }}" \
            -e "mikrus_ipv6=${{ secrets.MIKRUS_IPV6 }}" \
            -e "cytrus_host=${{ secrets.CYTRUS_IPV4 }}" \
            -e "cytrus_api_token=${{ secrets.CYTRUS_API_TOKEN }}" \
            -e "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -e "cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            -e "n8n_encryption_key=${{ secrets.N8N_ENCRYPTION_KEY }}"
